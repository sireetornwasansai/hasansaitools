<body>
<div id="bar" role="progressbar" aria-label="กำลังทำงาน"></div>
<div id="boot" class="boot" role="status"><div class="spin"></div><p id="bootmsg">กำลังโหลดแผนงาน…</p></div>
<div class="app" id="app"> <header class="top"> <h1>แผนการดำเนินงาน HA, HAIT และ Hospital Round</h1> <p>โรงพยาบาลสันทราย จังหวัดเชียงใหม่ ต.ค. 2569 ถึง ก.ย. 2570</p> <p class="role">ผู้จัดทำ: นักวิชาการสาธารณสุขปฏิบัติการ กลุ่มงานพัฒนาคุณภาพและมาตรฐาน</p> <p id="mode" class="mode"></p> </header> <section id="next" class="next" aria-live="polite"></section> <nav id="ribbon" class="ribbon" aria-label="เลือกเดือน"></nav> <main> <section id="v-cal"></section> <section id="v-iss" hidden></section> <section id="v-mtg" hidden></section> <section id="v-over" hidden></section> <section id="v-std" hidden></section> <section id="v-docs" hidden></section> <section id="v-hait" hidden></section> </main> <p class="foot" id="foot"></p> </div> <button id="fab" class="btn fab" hidden>+ บันทึกประเด็น</button> <div class="tabbar" role="tablist" aria-label="เมนูหลัก"><div class="in" id="tabs"></div></div> <div id="layer"></div> <div id="toast" class="toast" hidden role="status"></div>
<script>
/* โหลดแผน + แอปพร้อมกัน แล้วเริ่มเมื่อพร้อม; มี timeout และปุ่มลองใหม่ ไม่ให้ค้างหน้าว่าง */
(function(){var b=document.getElementById('boot'),m=document.getElementById('bootmsg'),slow;
function fail(){clearTimeout(slow);b.innerHTML='<p>โหลดข้อมูลแผนไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่</p><button class="btn" onclick="location.reload()">ลองใหม่</button>';}
slow=setTimeout(function(){m.textContent='ใช้เวลานานกว่าปกติ ยังโหลดอยู่…';},4000);
var c=new AbortController(),t=setTimeout(function(){c.abort();},20000);
fetch('data/plan.json',{signal:c.signal}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){clearTimeout(t);window.DATA=d;var s=document.createElement('script');s.src='js/app.js';
s.onload=function(){clearTimeout(slow);b.classList.add('out');setTimeout(function(){b.remove();},350);};s.onerror=fail;document.body.appendChild(s);}).catch(fail);})();
</script>
