const dl=(name,txt,mime)=>{const a=h('a',{href:URL.createObjectURL(new Blob([txt],{type:mime})),download:name});document.body.append(a);a.click();a.remove()};
function ics(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planner//TH'],e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\n/g,'\\n'),dd=s=>s.replace(/-/g,''),tt=t=>t.replace(':','')+'00',st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
S.ev.forEach(v=>{L.push('BEGIN:VEVENT','UID:'+v.id+'@planner','DTSTAMP:'+st);
if(v.al||!v.s)L.push('DTSTART;VALUE=DATE:'+dd(v.d),'DTEND;VALUE=DATE:'+dd(add(v.e||v.d,1)));else L.push('DTSTART:'+dd(v.d)+'T'+tt(v.s),'DTEND:'+dd(v.e||v.d)+'T'+tt(v.f||v.s));
if(v.r&&v.r.u!=='none')L.push('RRULE:FREQ='+{day:'DAILY',week:'WEEKLY',month:'MONTHLY',year:'YEARLY'}[v.r.u]+';INTERVAL='+(v.r.n||1)+(v.r.until?';UNTIL='+dd(v.r.until):''));
L.push('SUMMARY:'+e(v.t),'LOCATION:'+e(v.p),'DESCRIPTION:'+e(v.note),'END:VEVENT')});L.push('END:VCALENDAR');return L.join('\r\n')}

dlg.replaceChildren(h('h2',null,'ข้อมูล'),h('p',{style:'color:var(--mute);font-size:13px'},'ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ (ไม่แชร์กับทีมในหน้านี้) กรุณาส่งออกสำรองเป็นระยะ'),
h('div',{class:'acts'},h('button',{class:'btn',type:'button',onclick:()=>dl('planner-'+today()+'.json',JSON.stringify(S,null,1),'application/json')},'ส่งออก JSON (สำรอง)'),

/* ---- เหตุการณ์หลัก ---- */
const step=k=>{const a=P(ui.a);if(ui.v==='month')a.setMonth(a.getMonth()+k,1);else a.setDate(a.getDate()+k*(ui.v==='week'?7:30));ui.a=F(a);render()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#now').onclick=()=>{ui.a=today();render()};
$('#jump').onchange=e=>{if(e.target.value){ui.a=e.target.value;render()}};
$('#q').oninput=e=>{ui.q=e.target.value;render()};
$('#add').onclick=()=>edit(null,ui.v==='month'&&P(ui.a).getMonth()!==P(today()).getMonth()?ui.a:(ui.a||today()));

dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
render();
